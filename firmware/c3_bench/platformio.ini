; ESP32-C3 bench for the muzzle protocol layer. Prints results over USB serial.
;
;   pio run -t upload && pio device monitor
;
; Optional wiring for the UART loopback part: one jumper wire from GPIO4 to GPIO5.
; Without it the loopback part reports "no loopback wire" and the parser part still runs.
[env:esp32c3]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; The core is C++17; the Arduino core defaults to gnu++11. -O2 because the per-byte path
; is what is being measured, and -Os is not what would ship on it.
build_unflags = -std=gnu++11 -Os
build_flags =
    -std=gnu++17
    -O2
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    muzzle=symlink://../..
